(function(){
  var lang = 'zh', m = /[?&]lang=(zh|en)\b/.exec(location.search);
  try {
    if (m) lang = m[1];
    else {
      var s = JSON.parse(localStorage.getItem('shuxue-leyuan-v1') || 'null');
      if (s && s.settings && s.settings.lang) lang = s.settings.lang;
      else { var c = /(?:^|; )shuxueleyuan=[^;]*\.([01])[0-2][01]{5}(?:;|$)/.exec(document.cookie); if (c && c[1] === '1') lang = 'en'; }
    }
  } catch (e) {}
  if (lang !== 'en') lang = 'zh';
  document.write('<script src="audio/' + lang + '/manifest.js?v=' + ASSET_VERSION[lang] + '"><\/script>');
})();
